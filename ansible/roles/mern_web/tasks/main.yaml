---
- name: Install dependencies
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - nginx
    state: present
    update_cache: yes

- name: Create keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download NodeSource GPG key
  get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: '0644'

- name: Add NodeSource Node.js 24 repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_24.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js
  apt:
    name: nodejs
    state: present
    update_cache: yes

- name: Create project base directory
  file:
    path: /home/ubuntu/TravelMemory
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Clone TravelMemory Git repository
  git:
    repo: https://github.com/tb-repo/TravelMemory.git
    dest: /home/ubuntu/TravelMemory
    version: main
    force: yes
  become: no

# --- Backend Setup ---
- name: Install Backend NPM packages
  npm:
    path: /home/ubuntu/TravelMemory/backend
  become: no

- name: Configure Backend .env file
  template:
    src: backend_env.j2
    dest: /home/ubuntu/TravelMemory/backend/.env
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Copy backend systemd unit file
  template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start Backend Service
  service:
    name: backend
    state: restarted
    enabled: yes

# --- Frontend Setup ---
- name: Set baseUrl for production in frontend config
  copy:
    content: 'export const baseUrl = "";'
    dest: /home/ubuntu/TravelMemory/frontend/src/url.js
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Install Frontend NPM packages
  npm:
    path: /home/ubuntu/TravelMemory/frontend
  become: no

- name: Run Production build for React frontend
  shell: npm run build
  args:
    chdir: /home/ubuntu/TravelMemory/frontend
  become: no

- name: Create webroot directory
  file:
    path: /var/www/travelmemory/html
    state: directory
    mode: '0755'

- name: Copy React build files to Webroot
  copy:
    src: /home/ubuntu/TravelMemory/frontend/build/
    dest: /var/www/travelmemory/html/
    remote_src: yes

# --- Nginx Setup ---
- name: Copy travelmemory Nginx config template
  template:
    src: travelmemory.conf.j2
    dest: /etc/nginx/sites-available/travelmemory

- name: Remove default Nginx site configuration link
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Enable TravelMemory Nginx config symlink
  file:
    src: /etc/nginx/sites-available/travelmemory
    dest: /etc/nginx/sites-enabled/travelmemory
    state: link

- name: Restart Nginx Service
  service:
    name: nginx
    state: restarted
    enabled: yes